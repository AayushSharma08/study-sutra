<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Notes | Study Sutra</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="wrapper">
        <header>
            <nav class="navbar">
                <div class="left">
                    <div class="logo"></div>
                    <div class="brand">Study Sutra</div>
                </div>
                <div class="menu" id="menu-toggle">☰</div>
                <div class="navconnect" id="nav-links">
                    <a href="index.html">Home</a>
                    <a href="topics.html">Topics</a>
                    <a href="resources.html">Resources</a>
                    <a href="portfolio.html">Portfolio</a>
                    <a href="upload.html">Upload Notes</a>
                    <a href="contact.html">Contact</a>
                </div>
                <button class="toggle-btn" id="dark-mode-toggle">🌙</button>
            </nav>
            <h1>Upload Your Notes</h1>
        </header>

        <form id="uploadForm" enctype="multipart/form-data" method="POST" action="/upload">
            <input type="file" name="file" required />
            <button type="submit">Upload</button>
        </form>

        <h2>Uploaded Files</h2>
        <ul id="fileList"></ul>
    </div>

    <script>
        async function loadFiles() {
            const res = await fetch("/files");
            const files = await res.json();
            const list = document.getElementById("fileList");
            list.innerHTML = "";
            files.forEach(file => {
                const li = document.createElement("li");
                li.innerHTML = `<a href="/uploads/${file}" target="_blank">${file}</a>`;
                list.appendChild(li);
            });
        }
        loadFiles();
    </script>
</body>

</html>
